apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyper-backend
  labels:
    app: hyper-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hyper-backend
  template:
    metadata:
      labels:
        app: hyper-backend
    spec:
      containers:
        - name: backend
          image: hyper-saas-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: hyper-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          healthCheck:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: hyper-backend-service
spec:
  selector:
    app: hyper-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hyper-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hyper-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
