apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyper-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hyper-api
  template:
    metadata:
      labels:
        app: hyper-api
    spec:
      containers:
      - name: api
        image: hyper/api:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://hyper-redis-master:6379/0"
        - name: APP_ENV
          value: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyper-worker-llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hyper-worker-llm
  template:
    metadata:
      labels:
        app: hyper-worker-llm
    spec:
      containers:
      - name: worker
        image: hyper/api:latest
        command: ["celery", "-A", "backend.celery_app", "worker", "-Q", "celery", "-c", "2", "-l", "info", "--pool=prefork"]
        env:
        - name: REDIS_URL
          value: "redis://hyper-redis-master:6379/0"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyper-worker-vision
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hyper-worker-vision
  template:
    metadata:
      labels:
        app: hyper-worker-vision
    spec:
      containers:
      - name: worker
        image: hyper/api:latest
        command: ["celery", "-A", "backend.celery_app", "worker", "-Q", "celery", "-c", "4", "-l", "info", "--pool=prefork"]
        env:
        - name: REDIS_URL
          value: "redis://hyper-redis-master:6379/0"
        resources:
          requests:
            cpu: "2"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
