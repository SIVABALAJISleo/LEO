version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8005:8005"
    environment:
      - ENVIRONMENT=production
      - LEO_CACHE_SIZE=10GB
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://leo:leo@postgres:5432/leo_prod
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - leo_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: leo_prod
      POSTGRES_USER: leo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leo"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8005/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  leo_data:
  redis_data:
  postgres_data:

