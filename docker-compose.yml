version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8005:8005"
    environment:
      - ENVIRONMENT=production
      - LEO_CACHE_SIZE=10GB
    volumes:
      - leo_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8005/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  leo_data:
