name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      VITE_LEO_API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bunx vitest run

      - name: Build (production)
        run: bun run build

      - name: Build preview server (node preset for CI)
        run: NITRO_PRESET=node bun run build
        env:
          NITRO_PRESET: node

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: leo-frontend-dist
          path: |
            .output
            .vercel/output/static
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Playwright E2E (mocked backend)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    env:
      VITE_LEO_API_BASE_URL: http://localhost:8000
      NITRO_PRESET: node
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build (node preset for local preview)
        run: NITRO_PRESET=node bun run build
      - name: Run Playwright tests
        run: bunx playwright test
        env:
          E2E_BASE_URL: ""
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: Deployment smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    env:
      NITRO_PRESET: node
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: leo-frontend-dist
          path: .
          continue-on-error: true
      - name: Build if artifact unavailable
        run: |
          if [ ! -f .output/server/index.mjs ]; then
            echo "Artifact missing, rebuilding with node preset..."
            NITRO_PRESET=node bun run build
          fi
      - name: Boot Nitro preview server
        run: |
          nohup node .output/server/index.mjs > preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then
              echo "Preview up on :3000"; break
            fi
            sleep 1
          done
        env:
          PORT: 3000
          HOST: 127.0.0.1
      - name: Health check
        run: |
          curl -fsS http://127.0.0.1:3000 > /dev/null
          curl -fsS -o /dev/null -w "home:%{http_code}\n" http://127.0.0.1:3000/
      - name: Smoke test via Playwright
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: bunx playwright test e2e/smoke.spec.ts
      - name: Upload preview log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-preview-log
          path: preview.log
          if-no-files-found: ignore

  perf-budget:
    name: Web Vitals budget (LCP/INP/CLS)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    env:
      VITALS_BUDGET_LCP: "2500"
      VITALS_BUDGET_INP: "200"
      VITALS_BUDGET_CLS: "0.10"
      VITALS_ROUTES: "/,/features,/benchmarks,/docs"
      NITRO_PRESET: node
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: leo-frontend-dist
          path: .
          continue-on-error: true
      - name: Build if artifact unavailable
        run: |
          if [ ! -f .output/server/index.mjs ]; then
            echo "Artifact missing, rebuilding with node preset..."
            NITRO_PRESET=node bun run build
          fi
      - name: Boot Nitro preview server
        run: |
          nohup node .output/server/index.mjs > preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000 > /dev/null; then
              echo "Preview up on :3000"; break
            fi
            sleep 1
          done
        env:
          PORT: 3000
          HOST: 127.0.0.1
      - name: Check performance budget
        run: bun run perf:budget
        env:
          VITALS_BASE_URL: http://127.0.0.1:3000
      - name: Upload preview log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-preview-log
          path: preview.log
          if-no-files-found: ignore
