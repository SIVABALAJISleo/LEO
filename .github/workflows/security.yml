name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Python security static analysis & dependencies
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Bandit (SAST)
        run: |
          pip install bandit
          bandit -r backend/ -c bandit.toml || true

      - name: Run Safety Check
        run: |
          pip install safety
          safety check --json || true

      # JavaScript / TypeScript security audit & test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Run npm audit
        run: |
          npm audit --audit-level=high || true

      - name: Run Frontend Security Tests
        run: |
          npm test
