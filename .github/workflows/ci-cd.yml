name: HYPER CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Python Backend
  # ════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: Test Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Remove any local folder paths before installing (e.g. hyper_sdk/)
          grep -v '^\.' requirements.txt | grep -v '^[a-zA-Z0-9_-]*\/' > /tmp/clean_requirements.txt || cp requirements.txt /tmp/clean_requirements.txt
          pip install -r /tmp/clean_requirements.txt

      - name: Verify server starts
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          ALLOWED_ORIGINS: http://localhost:5173
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8005 &
          SERVER_PID=$!
          echo "Waiting for server (up to 60s)..."
          for i in $(seq 1 20); do
            sleep 3
            if curl -sf http://localhost:8005/health > /dev/null 2>&1; then
              echo "✅ Server ready after $((i*3))s"
              kill $SERVER_PID 2>/dev/null
              exit 0
            fi
            echo "  Attempt $i/20 — not ready yet"
          done
          echo "❌ Server failed to start in 60s"
          kill $SERVER_PID 2>/dev/null
          exit 1

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — React Frontend
  # ════════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build Frontend (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install packages
        run: npm ci

      - name: Type check (warnings only — never blocks build)
        run: npx tsc --noEmit || true

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Docker (only after both jobs above pass)
  # ════════════════════════════════════════════════════════════════════════════
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CRITICAL FIX: docker-container driver supports cache export
      # The default "docker" driver does NOT — this was causing the cache error
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry cache works with docker-container driver (no containerd needed)
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Deploy to Railway (main branch only)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Verify live health
        run: |
          echo "Waiting 30s for Railway to spin up..."
          sleep 30
          curl -f ${{ secrets.RAILWAY_PUBLIC_URL }}/health && echo "✅ Live!" || echo "⚠️ Health check failed — check Railway dashboard"
