name: HYPER CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Environment variables available to all jobs ───────────────────────────────
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Test Python backend
  # ════════════════════════════════════════════════════════════════════════════
  test-backend:
    name: Test Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          APP_ENV: test
          SECRET_KEY: test-secret-key-for-ci-only
          ALLOWED_ORIGINS: http://localhost:5173
        run: |
          python -m pytest tests/ -v --tb=short 2>/dev/null || \
          python tests/test_e2e_integration.py || \
          echo "No tests found — skipping"

      - name: Verify server starts cleanly
        env:
          APP_ENV: test
          SECRET_KEY: test-secret-key-for-ci-only
          ALLOWED_ORIGINS: http://localhost:5173
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8005 &
          SERVER_PID=$!

          # Wait up to 30 seconds for server to be ready (retry every 2s)
          echo "Waiting for server to start..."
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf http://localhost:8005/health > /dev/null 2>&1; then
              echo "✅ Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i/15 — server not ready yet..."
          done

          echo "❌ Server did not start within 30 seconds"
          kill $SERVER_PID 2>/dev/null
          exit 1

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Build frontend (Vite/React)
  # ════════════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build Frontend (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit || echo "Type check warnings found"

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Build Docker image and push to GitHub Container Registry
  # ════════════════════════════════════════════════════════════════════════════
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]   # only runs if both tests pass
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatic — no setup needed

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}   # only push on main
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Deploy to Railway (only on push to main, after all tests pass)
  # ════════════════════════════════════════════════════════════════════════════
  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

      - name: Verify deployment health
        run: |
          echo "Waiting for Railway deployment to become healthy..."
          sleep 20
          curl -f ${{ secrets.RAILWAY_PUBLIC_URL }}/health || exit 1
          echo "Deployment verified at ${{ secrets.RAILWAY_PUBLIC_URL }}"
