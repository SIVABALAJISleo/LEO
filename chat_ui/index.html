<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHOENIX RUNTIME — Chat Interface</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-color: #050810;
        --panel-bg: #0d1117;
        --chat-bg: #111827;
        --border-color: #1f2937;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --accent: #f97316;
        --accent-glow: rgba(249, 115, 22, 0.2);
        --user-msg: #1e293b;
        --ai-msg: #0d1117;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-primary);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background-image:
          linear-gradient(rgba(249, 115, 22, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(249, 115, 22, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 2rem;
        background: rgba(13, 17, 23, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
        z-index: 10;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 600;
        font-size: 1.2rem;
        letter-spacing: -0.5px;
      }

      .logo-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--accent), #dc2626);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 15px var(--accent-glow);
      }

      .telemetry-link {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border: 1px solid rgba(249, 115, 22, 0.3);
        border-radius: 6px;
        transition: all 0.2s;
      }

      .telemetry-link:hover {
        background: rgba(249, 115, 22, 0.1);
        box-shadow: 0 0 10px var(--accent-glow);
      }

      #chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        scroll-behavior: smooth;
      }

      .message-wrapper {
        display: flex;
        flex-direction: column;
        max-width: 800px;
        width: 100%;
        margin: 0 auto;
      }

      .message {
        display: flex;
        gap: 1rem;
        padding: 1.25rem;
        border-radius: 12px;
        animation: fadeIn 0.3s ease-out forwards;
        border: 1px solid transparent;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        background-color: var(--user-msg);
        border: 1px solid var(--border-color);
        align-self: flex-end;
        margin-left: auto;
      }

      .message.ai {
        background-color: var(--ai-msg);
        border: 1px solid var(--border-color);
        align-self: flex-start;
        margin-right: auto;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }

      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        flex-shrink: 0;
      }

      .user .avatar {
        background: var(--border-color);
        color: var(--text-primary);
      }

      .ai .avatar {
        background: linear-gradient(135deg, var(--accent), #dc2626);
        color: white;
        box-shadow: 0 0 10px var(--accent-glow);
      }

      .content {
        flex: 1;
        line-height: 1.6;
        font-size: 0.95rem;
      }

      .metadata {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        font-size: 0.75rem;
        font-family: "JetBrains Mono", monospace;
        color: var(--text-secondary);
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
      }

      .meta-tag {
        background: rgba(255, 255, 255, 0.05);
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .meta-tag.route {
        color: var(--accent);
        border-color: rgba(249, 115, 22, 0.3);
        background: rgba(249, 115, 22, 0.05);
      }

      .meta-tag.verified {
        color: #10b981;
        border-color: rgba(16, 185, 129, 0.3);
        background: rgba(16, 185, 129, 0.05);
      }

      #input-container {
        padding: 1.5rem 2rem;
        background: rgba(13, 17, 23, 0.9);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border-color);
        z-index: 10;
      }

      .input-wrapper {
        max-width: 800px;
        margin: 0 auto;
        position: relative;
        display: flex;
        align-items: center;
      }

      textarea {
        width: 100%;
        background: var(--chat-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 1rem;
        padding: 1rem 4rem 1rem 1.25rem;
        resize: none;
        height: 60px;
        line-height: 1.5;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent-glow);
      }

      button {
        position: absolute;
        right: 12px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
      }

      button:hover {
        background: #ea580c;
        transform: scale(1.05);
      }

      button:active {
        transform: scale(0.95);
      }

      button:disabled {
        background: var(--border-color);
        color: var(--text-secondary);
        cursor: not-allowed;
        transform: none;
      }

      /* Loading indicator */
      .typing {
        display: flex;
        gap: 4px;
        align-items: center;
        height: 24px;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
        animation: bounce 1.4s infinite ease-in-out both;
      }
      .dot:nth-child(1) {
        animation-delay: -0.32s;
      }
      .dot:nth-child(2) {
        animation-delay: -0.16s;
      }
      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: scale(0);
        }
        40% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <div class="logo-icon">🔥</div>
        PHOENIX RUNTIME
      </div>
      <a href="http://localhost:8766" target="_blank" class="telemetry-link">
        📊 View Telemetry Dashboard
      </a>
    </header>

    <div id="chat-container">
      <div class="message-wrapper">
        <div class="message ai">
          <div class="avatar">🔥</div>
          <div class="content">
            System online. PHOENIX RUNTIME initialized. Connection to local Ollama inference active.
            <br /><br />
            Try asking a math question (Rule Engine), or a general question (Ollama LLM). Watch the
            route changes below each message.
          </div>
        </div>
      </div>
    </div>

    <div id="input-container">
      <div class="input-wrapper">
        <textarea
          id="prompt"
          placeholder="Message PHOENIX..."
          rows="1"
          onkeydown="handleEnter(event)"
        ></textarea>
        <button id="send-btn" onclick="sendMessage()">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <script>
      const chatContainer = document.getElementById("chat-container");
      const promptInput = document.getElementById("prompt");
      const sendBtn = document.getElementById("send-btn");

      function handleEnter(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      }

      function addMessage(text, sender, meta = null) {
        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper";

        let contentHtml = text.replace(/\n/g, "<br>");

        let metaHtml = "";
        if (meta) {
          metaHtml = `
            <div class="metadata">
                <span class="meta-tag route">${meta.route}</span>
                <span class="meta-tag">${meta.latency}ms</span>
                ${meta.verified ? '<span class="meta-tag verified">✓ Verified</span>' : ""}
            </div>`;
        }

        wrapper.innerHTML = `
            <div class="message ${sender}">
                <div class="avatar">${sender === "user" ? "U" : "🔥"}</div>
                <div class="content">
                    ${contentHtml}
                    ${metaHtml}
                </div>
            </div>
        `;
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return wrapper;
      }

      function showLoading() {
        const wrapper = document.createElement("div");
        wrapper.className = "message-wrapper";
        wrapper.id = "loading-msg";
        wrapper.innerHTML = `
            <div class="message ai">
                <div class="avatar">🔥</div>
                <div class="content">
                    <div class="typing">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            </div>
        `;
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      function removeLoading() {
        const loading = document.getElementById("loading-msg");
        if (loading) loading.remove();
      }

      async function sendMessage() {
        const text = promptInput.value.trim();
        if (!text) return;

        // UI Updates
        promptInput.value = "";
        promptInput.disabled = true;
        sendBtn.disabled = true;

        addMessage(text, "user");
        showLoading();

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: text }),
          });

          const data = await response.json();
          removeLoading();

          addMessage(data.answer, "ai", {
            route: data.inference,
            latency: data.latency_ms,
            verified: data.verification,
          });
        } catch (error) {
          removeLoading();
          addMessage("Connection error: Could not reach PHOENIX RUNTIME API.", "ai");
        } finally {
          promptInput.disabled = false;
          sendBtn.disabled = false;
          promptInput.focus();
        }
      }
    </script>
  </body>
</html>
