[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
norecursedirs = venv scratch .git .pytest_cache

# ── Offline / CI environment settings ──────────────────────────────────────
# Prevents SentenceTransformer / HuggingFace from making network requests
# during test collection and execution (avoids 7+ test failures in offline CI).
env =
    LEO_OFFLINE=1
    TRANSFORMERS_OFFLINE=1
    HF_DATASETS_OFFLINE=1
