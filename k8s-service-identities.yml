# Define SPIFFE Identities (Service Accounts)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyper-api-gateway-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyper-celery-worker-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyper-redis-sa
---
# Allow API Gateway to talk to Redis
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-api-to-redis
  namespace: default
spec:
  selector:
    matchLabels:
      app: redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/hyper-api-gateway-sa"]
---
# Allow Workers to talk to Redis
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-workers-to-redis
  namespace: default
spec:
  selector:
    matchLabels:
      app: redis
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/default/sa/hyper-celery-worker-sa"]
---
# Expose API Gateway to External Ingress
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-api
  namespace: default
spec:
  selector:
    matchLabels:
      app: hyper-backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
