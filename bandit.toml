# bandit.toml — Security scan configuration for Project HYPER
# https://bandit.readthedocs.io/en/latest/config.html

[bandit]
# Scan the backend directory
targets = ["backend"]

# Minimum severity and confidence to report
level = "LOW"
confidence = "LOW"

# ──────────────────────────────────────────────────────────────────────────────
# SKIP RULES (with justification)
# ──────────────────────────────────────────────────────────────────────────────

skips = [
    # B301 - pickle.load: Used in backend/answers/semantic_canonical.py only for
    # reading trusted internal FAISS/embedding index files written by this
    # codebase itself. External data never reaches this call.
    # Marked with `# nosec B301` inline as additional defence.
    "B301",

    # B010 - setattr on function: Used in backend/core/security.py to
    # permanently monkey-patch onnx.hub._verify_repo_ref with an allowlist-based
    # verifier. This IS the security fix for the onnx.hub.load() supply-chain
    # bypass (onnx <= 1.20.1). Marked `# nosec B010` inline.
    "B010",
]
