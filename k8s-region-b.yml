# Active-Active Failover Replication Manifest for Region B (EU-Central)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyper-backend-eu-central
  labels:
    app: hyper-backend
    region: eu-central-1
spec:
  replicas: 2 # Baseline passive scale, auto-scales on traffic shift
  selector:
    matchLabels:
      app: hyper-backend
  template:
    metadata:
      labels:
        app: hyper-backend
        region: eu-central-1
    spec:
      containers:
        - name: backend
          image: hyper-saas-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DEPLOYMENT_REGION
              value: "eu-central-1"
          envFrom:
            - secretRef:
                name: hyper-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          healthCheck:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hyper-backend-eu-central-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hyper-backend-eu-central
  minReplicas: 2
  maxReplicas: 100 # Explode pod count immediately upon global DNS shift
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60 # Aggressive scaling trigger during failover
