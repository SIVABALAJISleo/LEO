[tool.pyright]
include = ["backend", "orchestration", "scripts", "tests"]
exclude = ["src", "**/node_modules", "**/__pycache__"]
venvPath = "."
venv = "venv"
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
extraPaths = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
