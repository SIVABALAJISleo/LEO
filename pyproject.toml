[tool.pyright]
include = [
    "backend",
    "orchestration",
    "chaos",
    "experts",
    "engine_hv",
    "predictors",
    "rag",
    "router",
    "routers",
    "adapters",
    "approximation",
    "retrieval"
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "src",
    "dist",
    "venv",
    ".git"
]
venvPath = "."
venv = "venv"
pythonVersion = "3.11"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
